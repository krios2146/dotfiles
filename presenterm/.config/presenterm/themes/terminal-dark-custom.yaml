---
extends: terminal-dark

bold:
  colors:
    foreground: red

default:
  margin:
    percent: 8

intro_slide:
  author:
    positioning: page_bottom
  footer: false

code:
  alignment: center
  minimum_size: 50
  minimum_margin:
    percent: 3
  theme_name: base16-eighties.dark
  padding:
    horizontal: 2
    vertical: 1
  background: true
  line_numbers: true

headings:
  h1:
    prefix: "██"
    colors:
      foreground: green
  h2:
    prefix: "▓▓▓"
    colors:
      foreground: magenta
  h3:
    prefix: "▒▒▒▒"
    colors:
      foreground: red
  h4:
    prefix: "░░░░░"
    colors:
      foreground: blue
  h5:
    prefix: "░░░░░░"
    colors:
      foreground: blue
  h6:
    prefix: "░░░░░░░"
    colors:
      foreground: blue

block_quote:
  prefix: "▍ "
  colors:
    foreground: white
    background: null
    prefix: yellow

alert:
  prefix: "▍ "
  base_colors:
    foreground: white
    background: null
  styles:
    note:
      color: blue
    tip:
      color: green
    important:
      color: magenta
    warning:
      color: yellow
    caution:
      color: red

typst:
  colors:
    foreground: "f0f0f0"

footer:
  style: template
  center: ""
  right: ""
  height: 5

modals:
  selection_colors:
    foreground: yellow

mermaid:
  background: transparent
  theme: dark

d2:
  theme: 200

layout_grid:
  color: blue
